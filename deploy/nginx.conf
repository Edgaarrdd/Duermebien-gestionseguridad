# Configuración endurecida de Nginx para el Portal de Seguridad (ISO 27001 / NIST)
# Ruta en servidor: /etc/nginx/sites-available/security-portal

limit_req_zone $binary_remote_addr zone=portal_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Endurecimiento: ocultar versión exacta de Nginx
    server_tokens off;

    # Registro de auditoría de accesos y errores
    access_log /var/log/nginx/security_portal_access.log;
    error_log  /var/log/nginx/security_portal_error.log warn;

    # Límite de tamaño de peticiones
    client_max_body_size 10M;

    # Cabeceras de endurecimiento web (Defense in Depth)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bloqueo de archivos ocultos o sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Proxy inverso hacia el servicio Gunicorn de la aplicación
    location / {
        # Rate limiting contra ataques de fuerza bruta y DoS
        limit_req zone=portal_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
